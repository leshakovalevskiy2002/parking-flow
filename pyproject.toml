[project]
name = "parking-flow"
version = "0.1.0"
description = ""
authors = [
    {name = "leshakovalevskiy2002",email = "lesha_programmer02_gt@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "pydantic[email] (>=2.13.5,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pyjwt (>=2.15.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)"
]

[tool.poetry]
packages = [{include = "parking_flow", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.8,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]


[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true


[tool.ruff]
target-version = "py312"
line-length = 100

exclude = [
    ".git",
    "__pycache__",
    ".idea",
    ".mypy_cache",
    ".ruff_cache",
    "poetry.lock",
    "README.md",
    ".pytest_cache",
    "alembic/versions",
    ".pre-commit-config.yaml",
    ".gitignore",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
    "RUF"
]

ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
